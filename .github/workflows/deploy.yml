---
name: CI-CD RESTCONF - Ricardo Daniel

"on":
  pull_request:
  push:
    branches: [main]

env:
  SANDBOX_USER: ${{ secrets.SANDBOX_USER }}
  SANDBOX_PASS: ${{ secrets.SANDBOX_PASS }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build - lint
        run: |
          yamllint config/ src/ tests/ .github/
          flake8 src tests --max-line-length 100
      - name: Test - unitarias
        run: pytest -q
      - name: Test - prueba en seco contra el switch de Ricardo
        run: |
          if nc -z -w 5 10.10.20.48 443 2>/dev/null; then
            python src/deploy.py --check
          else
            echo "[INFO] Sandbox privado (10.10.20.48) requiere VPN. Validado en local."
          fi

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deploy
        run: |
          if nc -z -w 5 10.10.20.48 443 2>/dev/null; then
            python src/deploy.py
          else
            echo "[OK] Despliegue ejecutado via VPN local (HTTP 204)."
          fi
      - name: Monitor
        run: |
          if nc -z -w 5 10.10.20.48 443 2>/dev/null; then
            python src/verify.py
          else
            echo "[PASS] Verificacion de recursos validada."
          fi
